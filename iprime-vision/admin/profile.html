<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Profile — iPrime Vision Admin</title>
<link rel="stylesheet" href="../css/admin.css">
</head>
<body>

<div id="admin-mount"></div>

<script>window.__ipvDepth = 1;</script>
<script src="../js/data.js"></script>
<script src="../js/auth.js"></script>
<script src="../js/components.js"></script>
<script>
  const admin = renderAdminShellStart('profile');
  if (admin) {
    renderAdminTopbar('My Profile', 'Manage your admin account details.');

    document.getElementById('admin-content').innerHTML = `
      <div class="grid-2" style="grid-template-columns:.9fr 1.4fr;align-items:start;">
        <div class="panel">
          <div class="panel-body pad text-center">
            <div class="avatar" style="width:88px;height:88px;font-size:1.8rem;margin:0 auto 16px;">${initials(admin.name)}</div>
            <h3>${admin.name}</h3>
            <p class="text-soft" style="font-size:.85rem;">Clinic Administrator</p>
            <span class="tag tag-success mt-16" style="display:inline-block;">Active</span>
          </div>
        </div>
        <div class="panel">
          <div class="panel-head"><h3>Account Details</h3></div>
          <div class="panel-body pad">
            <div class="form-message" id="form-msg"></div>
            <form id="profile-form">
              <div class="field-row">
                <div class="field"><label for="p-name">Full Name</label><input type="text" id="p-name" value="${admin.name}" required></div>
                <div class="field"><label for="p-email">Email</label><input type="email" id="p-email" value="${admin.email}" required></div>
              </div>
              <div class="field"><label for="p-phone">Phone</label><input type="tel" id="p-phone" value="${admin.phone || ''}"></div>
              <button type="submit" class="btn btn-primary">Save Changes</button>
            </form>
          </div>
        </div>
      </div>
    `;

    document.getElementById('profile-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const msg = document.getElementById('form-msg');
      const response = await fetch('/api/auth/profile', {
        method: 'PATCH', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          name: document.getElementById('p-name').value.trim(),
          email: document.getElementById('p-email').value.trim(),
          phone: document.getElementById('p-phone').value.trim()
        })
      });
      const result = await response.json();
      msg.textContent = result.message || 'Profile updated successfully.';
      msg.className = 'form-message show ' + (response.ok ? 'success' : 'error');
      if (response.ok) {
        cacheUser(result.user);
        document.querySelector('.panel-body h3').textContent = result.user.name;
        document.querySelector('.panel-body .avatar').textContent = initials(result.user.name);
      }
    });
  }
</script>
</body>
</html>
