<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reports — iPrime Vision Admin</title>
<link rel="stylesheet" href="../css/admin.css">
</head>
<body>

<div id="admin-mount"></div>

<script>window.__ipvDepth = 1;</script>
<script src="../js/data.js"></script>
<script src="../js/auth.js"></script>
<script src="../js/components.js"></script>
<script>
  const admin = renderAdminShellStart('reports');
  if (admin) {
    renderAdminTopbar('Reports', 'Clinic performance at a glance.');

    const appts = Store.appointments();
    const patients = Store.patients();
    const invAll = Store.invoices();
    const rx = Store.prescriptions();
    const revenue = invAll.filter(i => i.status === 'Paid').reduce((s,i) => s + i.amount, 0);

    const byStatus = ['Confirmed', 'Pending', 'Cancelled'].map(s => ({ s, c: appts.filter(a => a.status === s).length }));
    const byService = {};
    appts.forEach(a => { byService[a.service] = (byService[a.service] || 0) + 1; });
    const serviceEntries = Object.entries(byService).sort((a,b) => b[1] - a[1]);
    const maxService = Math.max(1, ...serviceEntries.map(e => e[1]));

    document.getElementById('admin-content').innerHTML = `
      <div class="grid-4 mb-24">
        <div class="stat-card"><div class="stat-top"><span class="stat-label">Total Patients</span><div class="stat-icon nude">${svg('users')}</div></div><div class="stat-value">${patients.length}</div></div>
        <div class="stat-card"><div class="stat-top"><span class="stat-label">Total Appointments</span><div class="stat-icon latte">${svg('calendar')}</div></div><div class="stat-value">${appts.length}</div></div>
        <div class="stat-card"><div class="stat-top"><span class="stat-label">Prescriptions Issued</span><div class="stat-icon info">${svg('glasses')}</div></div><div class="stat-value">${rx.length}</div></div>
        <div class="stat-card"><div class="stat-top"><span class="stat-label">Revenue Collected</span><div class="stat-icon warning">${svg('card')}</div></div><div class="stat-value">₱${revenue.toLocaleString()}</div></div>
      </div>

      <div class="grid-2" style="align-items:start;">
        <div class="panel">
          <div class="panel-head"><h3>Appointments by Status</h3></div>
          <div class="panel-body pad" style="display:grid;gap:16px;">
            ${byStatus.map(b => `
              <div>
                <div class="flex-between mb-8"><span>${b.s}</span><strong>${b.c}</strong></div>
                <div class="progress-bar"><span style="width:${appts.length ? (b.c / appts.length) * 100 : 0}%; background:${b.s === 'Confirmed' ? 'var(--success)' : b.s === 'Pending' ? 'var(--warning)' : 'var(--danger)'}"></span></div>
              </div>`).join('')}
          </div>
        </div>
        <div class="panel">
          <div class="panel-head"><h3>Most Requested Services</h3></div>
          <div class="panel-body pad" style="display:grid;gap:16px;">
            ${serviceEntries.map(([name, c]) => `
              <div>
                <div class="flex-between mb-8"><span>${name}</span><strong>${c}</strong></div>
                <div class="progress-bar"><span style="width:${(c / maxService) * 100}%"></span></div>
              </div>`).join('') || '<p class="text-soft">No data yet.</p>'}
          </div>
        </div>
      </div>

      <div class="panel mt-24">
        <div class="panel-head"><h3>Export</h3></div>
        <div class="panel-body pad flex gap-16" style="flex-wrap:wrap;">
          <button class="btn btn-outline btn-sm" id="export-appts">${svg('fileText')} Export Appointments (CSV)</button>
          <button class="btn btn-outline btn-sm" id="export-patients">${svg('fileText')} Export Patients (CSV)</button>
          <button class="btn btn-outline btn-sm" id="export-billing">${svg('fileText')} Export Billing (CSV)</button>
        </div>
      </div>
    `;

    function toCSV(rows, headers) {
      const esc = (v) => `"${String(v).replace(/"/g, '""')}"`;
      return [headers.join(','), ...rows.map(r => headers.map(h => esc(r[h] ?? '')).join(','))].join('\n');
    }
    function download(filename, content) {
      const blob = new Blob([content], { type: 'text/csv' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = filename;
      a.click();
    }

    document.getElementById('export-appts').addEventListener('click', () => {
      download('appointments.csv', toCSV(appts, ['patient', 'service', 'date', 'time', 'status']));
    });
    document.getElementById('export-patients').addEventListener('click', () => {
      download('patients.csv', toCSV(patients, ['name', 'email', 'phone', 'condition', 'status']));
    });
    document.getElementById('export-billing').addEventListener('click', () => {
      download('billing.csv', toCSV(invAll, ['patient', 'service', 'date', 'amount', 'status']));
    });
  }
</script>
</body>
</html>
