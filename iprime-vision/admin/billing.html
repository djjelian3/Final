<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Billing & Payments — iPrime Vision Admin</title>
<link rel="stylesheet" href="../css/admin.css">
</head>
<body>

<div id="admin-mount"></div>

<script>window.__ipvDepth = 1;</script>
<script src="../js/data.js"></script>
<script src="../js/auth.js"></script>
<script src="../js/components.js"></script>
<script>
  const admin = renderAdminShellStart('billing');
  if (admin) {
    renderAdminTopbar('Billing & Payments', 'Invoices, payments, and outstanding balances.');

    const invAll = Store.invoices();
    const totalRevenue = invAll.filter(i => i.status === 'Paid').reduce((s,i) => s + i.amount, 0);
    const pending = invAll.filter(i => i.status === 'Pending').reduce((s,i) => s + i.amount, 0);
    const overdue = invAll.filter(i => i.status === 'Overdue').reduce((s,i) => s + i.amount, 0);

    document.getElementById('admin-content').innerHTML = `
      <div class="grid-3 mb-24">
        <div class="stat-card"><div class="stat-top"><span class="stat-label">Total Revenue</span><div class="stat-icon nude">${svg('card')}</div></div><div class="stat-value" id="billing-revenue">₱${totalRevenue.toLocaleString()}</div></div>
        <div class="stat-card"><div class="stat-top"><span class="stat-label">Pending</span><div class="stat-icon info">${svg('clock')}</div></div><div class="stat-value" id="billing-pending">₱${pending.toLocaleString()}</div></div>
        <div class="stat-card"><div class="stat-top"><span class="stat-label">Overdue</span><div class="stat-icon warning">${svg('alert')}</div></div><div class="stat-value" id="billing-overdue">₱${overdue.toLocaleString()}</div></div>
      </div>
      <div class="panel">
        <div class="panel-body pad">
          <div class="toolbar">
            <div class="search-box">${svg('search')}<input type="text" id="search" placeholder="Search by patient…"></div>
            <button class="btn btn-primary btn-sm" id="add-btn" style="margin-left:auto;">${svg('plus')} New Invoice</button>
          </div>
          <div class="table-wrap">
            <table class="data-table">
              <thead><tr><th>Patient</th><th>Service</th><th>Date</th><th>Amount</th><th>Status</th><th></th></tr></thead>
              <tbody id="rows"></tbody>
            </table>
          </div>
        </div>
      </div>
      <div class="modal-overlay" id="invoice-modal" role="dialog" aria-modal="true" aria-labelledby="invoice-modal-title">
        <div class="modal-box">
          <div class="modal-head">
            <div>
              <span class="eyebrow">Accounts receivable</span>
              <h2 id="invoice-modal-title">New Invoice</h2>
            </div>
            <button class="modal-close" type="button" id="close-invoice-modal" aria-label="Close">${svg('x')}</button>
          </div>
          <form id="invoice-form">
            <div class="field">
              <label for="invoice-patient">Patient name</label>
              <input id="invoice-patient" required placeholder="e.g. Juan Dela Cruz">
            </div>
            <div class="field">
              <label for="invoice-service">Service</label>
              <input id="invoice-service" value="Eye Examination" required>
            </div>
            <div class="field">
              <label for="invoice-amount">Amount (₱)</label>
              <input id="invoice-amount" type="number" min="0" step="1" value="1000" required>
            </div>
            <div class="field-row">
              <div class="field"><label for="invoice-date">Invoice date</label><input id="invoice-date" type="date" value="${todayISO()}" required></div>
              <div class="field"><label for="invoice-status">Payment status</label><select id="invoice-status"><option>Pending</option><option>Paid</option><option>Overdue</option></select></div>
            </div>
            <div class="modal-actions">
              <button class="btn btn-ghost" type="button" id="cancel-invoice">Cancel</button>
              <button class="btn btn-primary" type="submit">${svg('check')} Save Invoice</button>
            </div>
          </form>
        </div>
      </div>
    `;

    const invoiceModal = document.getElementById('invoice-modal');
    const invoiceForm = document.getElementById('invoice-form');
    function closeInvoiceModal() {
      invoiceModal.classList.remove('open');
      invoiceForm.reset();
      document.getElementById('invoice-service').value = 'Eye Examination';
      document.getElementById('invoice-amount').value = '1000';
      document.getElementById('invoice-date').value = todayISO();
      document.getElementById('invoice-status').value = 'Pending';
    }

    let query = '';
    function updateBillingStats() {
      const invoices = Store.invoices();
      document.getElementById('billing-revenue').textContent = '₱' + invoices.filter(i => i.status === 'Paid').reduce((sum, item) => sum + item.amount, 0).toLocaleString();
      document.getElementById('billing-pending').textContent = '₱' + invoices.filter(i => i.status === 'Pending').reduce((sum, item) => sum + item.amount, 0).toLocaleString();
      document.getElementById('billing-overdue').textContent = '₱' + invoices.filter(i => i.status === 'Overdue').reduce((sum, item) => sum + item.amount, 0).toLocaleString();
    }
    function render() {
      updateBillingStats();
      let list = Store.invoices().slice().sort((a,b) => b.date.localeCompare(a.date));
      if (query) list = list.filter(i => i.patient.toLowerCase().includes(query.toLowerCase()));
      const rows = document.getElementById('rows');
      if (!list.length) { rows.innerHTML = `<tr><td colspan="6"><div class="empty-state">${svg('card')}<p>No invoices found.</p></div></td></tr>`; return; }
      rows.innerHTML = list.map(i => `
        <tr>
          <td><strong>${i.patient}</strong></td>
          <td>${i.service}</td>
          <td>${fmtDate(i.date)}</td>
          <td>₱${i.amount.toLocaleString()}</td>
          <td><span class="tag ${i.status === 'Paid' ? 'tag-success' : i.status === 'Pending' ? 'tag-warning' : 'tag-danger'}">${i.status}</span></td>
          <td>
            <div class="flex gap-8">
              ${i.status !== 'Paid' ? `<button class="action-icon" title="Mark Paid" onclick="markPaid('${i.id}')">${svg('check')}</button>` : ''}
              <button class="action-icon" title="Delete" onclick="removeInv('${i.id}')">${svg('trash')}</button>
            </div>
          </td>
        </tr>`).join('');
    }

    window.markPaid = function(id) {
      const list = Store.invoices();
      const item = list.find(i => i.id === id);
      if (item) item.status = 'Paid';
      Store.saveInvoices(list);
      render();
    };
    window.removeInv = function(id) {
      if (!confirm('Delete this invoice?')) return;
      Store.saveInvoices(Store.invoices().filter(i => i.id !== id));
      render();
    };

    document.getElementById('search').addEventListener('input', (e) => { query = e.target.value; render(); });
    document.getElementById('add-btn').addEventListener('click', () => {
      invoiceModal.classList.add('open');
      document.getElementById('invoice-patient').focus();
    });
    document.getElementById('close-invoice-modal').addEventListener('click', closeInvoiceModal);
    document.getElementById('cancel-invoice').addEventListener('click', closeInvoiceModal);
    invoiceModal.addEventListener('click', (event) => {
      if (event.target === invoiceModal) closeInvoiceModal();
    });
    invoiceForm.addEventListener('submit', (event) => {
      event.preventDefault();
      const patient = document.getElementById('invoice-patient').value.trim();
      const service = document.getElementById('invoice-service').value.trim();
      const amount = parseInt(document.getElementById('invoice-amount').value, 10);
      const date = document.getElementById('invoice-date').value;
      const status = document.getElementById('invoice-status').value;
      if (!patient || !service || !date || Number.isNaN(amount) || amount < 0) return;
      const list = Store.invoices();
      list.push({ id: uid('inv-bill'), patient, date, service, amount, status });
      Store.saveInvoices(list);
      render();
      closeInvoiceModal();
    });

    render();
  }
</script>
</body>
</html>
