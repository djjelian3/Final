<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Dashboard — iPrime Vision</title>
<link rel="stylesheet" href="../css/admin.css">
</head>
<body>

<div id="admin-mount"></div>

<script>window.__ipvDepth = 1;</script>
<script src="../js/data.js"></script>
<script src="../js/auth.js"></script>
<script src="../js/components.js"></script>
<script>
  const admin = renderAdminShellStart('dashboard');
  if (admin) {
    renderAdminTopbar('Welcome back, ' + admin.name.split(' ')[0] + '!', "Here's what's happening at iPrime Vision today.");

    const appts = Store.appointments();
    const today = todayISO();
    const todaysAppts = appts.filter(a => a.date === today);
    const patients = Store.patients();
    const rx = Store.prescriptions();
    const inv = Store.inventory();
    const lowStock = inv.filter(i => i.status === 'Low Stock');
    const notifs = Store.notifications().filter(n => n.audience === 'admin').sort((a,b) => new Date(b.time) - new Date(a.time));

    document.getElementById('admin-content').innerHTML = `
      <div class="grid-4 mb-24">
        <div class="stat-card">
          <div class="stat-top"><span class="stat-label">Today's Appointments</span><div class="stat-icon nude">${svg('calendar')}</div></div>
          <div class="stat-value">${todaysAppts.length}</div>
          <a class="stat-link" href="appointments.html">View all appointments →</a>
        </div>
        <div class="stat-card">
          <div class="stat-top"><span class="stat-label">Total Patients</span><div class="stat-icon latte">${svg('users')}</div></div>
          <div class="stat-value">${patients.length}</div>
          <a class="stat-link" href="patients.html">View patients →</a>
        </div>
        <div class="stat-card">
          <div class="stat-top"><span class="stat-label">Total Prescriptions</span><div class="stat-icon info">${svg('glasses')}</div></div>
          <div class="stat-value">${rx.length}</div>
          <a class="stat-link" href="prescriptions.html">View prescriptions →</a>
        </div>
        <div class="stat-card">
          <div class="stat-top"><span class="stat-label">Low Stock Items</span><div class="stat-icon warning">${svg('cart')}</div></div>
          <div class="stat-value">${lowStock.length}</div>
          <a class="stat-link" href="inventory.html">View inventory →</a>
        </div>
      </div>

      <div class="grid-2" style="grid-template-columns:1.4fr 1fr;align-items:start;">
        <div class="panel">
          <div class="panel-head"><h3>Upcoming Appointments</h3><a href="appointments.html" class="stat-link">View all</a></div>
          <div class="panel-body" id="upcoming-list"></div>
        </div>
        <div class="panel">
          <div class="panel-head"><h3>Recent Notifications</h3><a href="notifications.html" class="stat-link">View all</a></div>
          <div class="panel-body" id="notif-list"></div>
        </div>
      </div>

      <div class="grid-2 mt-24" style="grid-template-columns:1.4fr 1fr;align-items:start;">
        <div class="panel">
          <div class="panel-head"><h3>Appointments Overview</h3><span class="text-soft" style="font-size:.82rem;">This Month</span></div>
          <div class="panel-body pad"><svg id="chart" viewBox="0 0 560 200" style="width:100%;height:200px;"></svg></div>
        </div>
        <div class="panel">
          <div class="panel-head"><h3>Quick Actions</h3></div>
          <div class="quick-actions">
            <a href="appointments.html" class="qa-btn">${svg('calendar')} New Appointment</a>
            <a href="patients.html" class="qa-btn">${svg('user')} New Patient</a>
            <a href="prescriptions.html" class="qa-btn">${svg('glasses')} Add Prescription</a>
            <a href="eyewear.html" class="qa-btn">${svg('box')} Add Product</a>
          </div>
        </div>
      </div>
    `;

    // Upcoming appointments list (next 4)
    const upcoming = appts.filter(a => a.date >= today).sort((a,b) => a.date.localeCompare(b.date)).slice(0, 4);
    document.getElementById('upcoming-list').innerHTML = upcoming.length ? upcoming.map(a => `
      <div class="list-row">
        <div class="lr-time">${a.time}<span>${fmtDate(a.date)}</span></div>
        <div class="lr-main"><strong>${a.patient}</strong><small>${a.service}</small></div>
        <span class="tag ${a.status === 'Confirmed' ? 'tag-success' : 'tag-warning'}">${a.status}</span>
      </div>`).join('') : '<div class="empty-state">' + svg('calendar') + '<p>No upcoming appointments.</p></div>';

    // Notifications
    document.getElementById('notif-list').innerHTML = notifs.slice(0, 4).map(n => `
      <div class="notif-row">
        <div class="notif-dot">${svg(n.type === 'appointment' ? 'calendar' : n.type === 'prescription' ? 'glasses' : n.type === 'inventory' ? 'cart' : 'bell')}</div>
        <div class="nr-main"><strong>${n.title}</strong><small>${timeAgo(n.time)}</small></div>
        ${!n.read ? '<span class="unread-dot"></span>' : ''}
      </div>`).join('');

    // Simple line chart (appointments per weekday, demo data derived from count)
    const days = ['Mon','Tue','Wed','Thu','Fri','Sat'];
    const counts = [8, 12, 9, 14, 10, 13];
    const w = 560, h = 200, pad = 30;
    const maxC = Math.max(...counts) + 4;
    const stepX = (w - pad * 2) / (counts.length - 1);
    const pts = counts.map((c, i) => {
      const x = pad + i * stepX;
      const y = h - pad - (c / maxC) * (h - pad * 2);
      return [x, y];
    });
    const path = pts.map((p, i) => (i === 0 ? 'M' : 'L') + p[0] + ',' + p[1]).join(' ');
    const dots = pts.map(p => `<circle cx="${p[0]}" cy="${p[1]}" r="4" fill="#4A2F22"/>`).join('');
    const labels = pts.map((p, i) => `<text x="${p[0]}" y="${h - 6}" font-size="11" fill="#7A5B45" text-anchor="middle">${days[i]}</text>`).join('');
    document.getElementById('chart').innerHTML = `<path d="${path}" fill="none" stroke="#B98F63" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>${dots}${labels}`;
  }
</script>
</body>
</html>
