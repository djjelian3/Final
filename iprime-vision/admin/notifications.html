<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Notifications — iPrime Vision Admin</title>
<link rel="stylesheet" href="../css/admin.css">
</head>
<body>

<div id="admin-mount"></div>

<script>window.__ipvDepth = 1;</script>
<script src="../js/data.js"></script>
<script src="../js/auth.js"></script>
<script src="../js/components.js"></script>
<script>
  const admin = renderAdminShellStart('notifications');
  if (admin) {
    renderAdminTopbar('Notifications', 'Stay on top of appointments, prescriptions, and stock alerts.');

    document.getElementById('admin-content').innerHTML = `
      <div class="panel">
        <div class="panel-head">
          <h3>All Notifications</h3>
          <button class="btn btn-outline btn-sm" id="mark-all">${svg('check')} Mark all as read</button>
        </div>
        <div class="panel-body" id="list"></div>
      </div>
    `;

    let questions = [];

    function escapeHtml(value) {
      return String(value).replace(/[&<>'"]/g, character => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[character]));
    }

    function render() {
      const localList = Store.notifications().filter(n => n.audience === 'admin').sort((a,b) => new Date(b.time) - new Date(a.time));
      const questionList = questions.map(q => ({
        id: `faq_${q.id}`,
        title: `New question from ${escapeHtml(q.name)}`,
        message: `${escapeHtml(q.question)} (${escapeHtml(q.email)})`,
        time: q.created_at,
        read: q.read,
        type: 'question',
        questionId: q.id
      }));
      const list = [...questionList, ...localList].sort((a,b) => new Date(b.time) - new Date(a.time));
      const el = document.getElementById('list');
      if (!list.length) { el.innerHTML = `<div class="empty-state">${svg('bell')}<p>No notifications.</p></div>`; return; }
      el.innerHTML = list.map(n => `
        <div class="notif-row" style="cursor:pointer;" onclick="markRead('${n.id}', ${n.questionId || 'null'})">
          <div class="notif-dot">${svg(n.type === 'appointment' ? 'calendar' : n.type === 'prescription' ? 'glasses' : n.type === 'inventory' ? 'cart' : 'bell')}</div>
          <div class="nr-main"><strong>${n.title}</strong>${n.message ? `<p style="margin:4px 0 0;font-size:.82rem;color:var(--text-soft);">${n.message}</p>` : ''}<small>${timeAgo(n.time)}</small></div>
          ${!n.read ? '<span class="unread-dot"></span>' : ''}
        </div>`).join('');
    }

    window.markRead = async function(id, questionId) {
      if (questionId) {
        await fetch(`/api/faq/questions/${questionId}`, { method: 'PATCH' });
        const question = questions.find(item => item.id === questionId);
        if (question) question.read = true;
        render();
        return;
      }
      const list = Store.notifications();
      const item = list.find(n => n.id === id);
      if (item) item.read = true;
      Store.saveNotifications(list);
      render();
    };

    document.getElementById('mark-all').addEventListener('click', async () => {
      await fetch('/api/faq/questions/read-all', { method: 'POST' });
      questions.forEach(question => { question.read = true; });
      const list = Store.notifications();
      list.forEach(n => { if (n.audience === 'admin') n.read = true; });
      Store.saveNotifications(list);
      render();
    });

    async function loadQuestions() {
      const response = await fetch('/api/faq/questions');
      if (response.ok) {
        const result = await response.json();
        questions = result.questions || [];
      }
      render();
    }

    loadQuestions();
  }
</script>
</body>
</html>
