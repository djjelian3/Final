<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Inventory — iPrime Vision Admin</title>
<link rel="stylesheet" href="../css/admin.css">
</head>
<body>

<div id="admin-mount"></div>

<script>window.__ipvDepth = 1;</script>
<script src="../js/data.js"></script>
<script src="../js/auth.js"></script>
<script src="../js/components.js"></script>
<script>
  const admin = renderAdminShellStart('inventory');
  if (admin) {
    renderAdminTopbar('Inventory', 'Stock levels across frames, lenses, and accessories.');

    const inv = Store.inventory();
    const low = inv.filter(i => i.status === 'Low Stock').length;

    document.getElementById('admin-content').innerHTML = `
      <div class="grid-3 mb-24">
        <div class="stat-card"><div class="stat-top"><span class="stat-label">Total SKUs</span><div class="stat-icon nude">${svg('box')}</div></div><div class="stat-value" id="inventory-total">${inv.length}</div></div>
        <div class="stat-card"><div class="stat-top"><span class="stat-label">Low Stock Items</span><div class="stat-icon warning">${svg('alert')}</div></div><div class="stat-value" id="inventory-low">${low}</div></div>
        <div class="stat-card"><div class="stat-top"><span class="stat-label">Units on Hand</span><div class="stat-icon info">${svg('layers')}</div></div><div class="stat-value" id="inventory-units">${inv.reduce((s,i)=>s+i.stock,0)}</div></div>
      </div>
      <div class="panel">
        <div class="panel-body pad">
          <div class="toolbar">
            <div class="search-box">${svg('search')}<input type="text" id="search" placeholder="Search inventory…"></div>
            <button class="filter-chip active" data-f="all">All</button>
            <button class="filter-chip" data-f="Low Stock">Low Stock</button>
            <button class="btn btn-primary btn-sm" id="add-btn" style="margin-left:auto;">${svg('plus')} Add Item</button>
          </div>
          <div class="table-wrap">
            <table class="data-table">
              <thead><tr><th>Item</th><th>SKU</th><th>Category</th><th>Stock</th><th>Reorder Level</th><th>Status</th><th></th></tr></thead>
              <tbody id="rows"></tbody>
            </table>
          </div>
        </div>
      </div>
    `;

    document.getElementById('admin-content').insertAdjacentHTML('beforeend', `
      <div class="modal-overlay" id="inventory-modal" role="dialog" aria-modal="true" aria-labelledby="inventory-modal-title">
        <div class="modal-box">
          <div class="modal-head">
            <div><span class="eyebrow">Stock control</span><h2 id="inventory-modal-title">Add Inventory Item</h2></div>
            <button class="modal-close" type="button" id="close-inventory-modal" aria-label="Close">${svg('x')}</button>
          </div>
          <form id="inventory-form">
            <div class="field"><label for="inventory-item">Item name</label><input id="inventory-item" required placeholder="e.g. Lens Cleaning Solution"></div>
            <div class="field"><label for="inventory-category">Category</label><select id="inventory-category"><option>Accessories</option><option>Eyeglasses</option><option>Sunglasses</option><option>Contact Lenses</option></select></div>
            <div class="field-row">
              <div class="field"><label for="inventory-stock">Stock quantity</label><input id="inventory-stock" type="number" min="0" step="1" value="20" required></div>
              <div class="field"><label for="inventory-reorder">Reorder level</label><input id="inventory-reorder" type="number" min="0" step="1" value="8" required></div>
            </div>
            <div class="modal-actions"><button class="btn btn-ghost" type="button" id="cancel-inventory">Cancel</button><button class="btn btn-primary" type="submit">${svg('check')} Add Item</button></div>
          </form>
        </div>
      </div>
    `);

    const inventoryModal = document.getElementById('inventory-modal');
    const inventoryForm = document.getElementById('inventory-form');
    function closeInventoryModal() { inventoryModal.classList.remove('open'); inventoryForm.reset(); }

    let query = '', filter = 'all';
    function render() {
      const allItems = Store.inventory();
      document.getElementById('inventory-total').textContent = allItems.length;
      document.getElementById('inventory-low').textContent = allItems.filter(i => i.status === 'Low Stock').length;
      document.getElementById('inventory-units').textContent = allItems.reduce((sum, item) => sum + item.stock, 0);
      let list = allItems.slice();
      if (filter !== 'all') list = list.filter(i => i.status === filter);
      if (query) list = list.filter(i => i.item.toLowerCase().includes(query.toLowerCase()));
      const rows = document.getElementById('rows');
      if (!list.length) { rows.innerHTML = `<tr><td colspan="7"><div class="empty-state">${svg('box')}<p>No items found.</p></div></td></tr>`; return; }
      rows.innerHTML = list.map(i => `
        <tr>
          <td><strong>${i.item}</strong></td>
          <td class="text-soft">${i.sku}</td>
          <td>${i.category}</td>
          <td>
            <div class="flex gap-8" style="align-items:center;">
              <span>${i.stock}</span>
              <div class="progress-bar" style="width:70px;"><span style="width:${Math.min(100, (i.stock / (i.reorderLevel * 2)) * 100)}%"></span></div>
            </div>
          </td>
          <td>${i.reorderLevel}</td>
          <td><span class="tag ${i.status === 'Low Stock' ? 'tag-warning' : 'tag-success'}">${i.status}</span></td>
          <td>
            <div class="flex gap-8">
              <button class="action-icon" title="Restock +10" onclick="restock('${i.id}')">${svg('plus')}</button>
              <button class="action-icon" title="Remove" onclick="removeItem('${i.id}')">${svg('trash')}</button>
            </div>
          </td>
        </tr>`).join('');
    }

    function refreshStatus(item) { item.status = item.stock <= item.reorderLevel ? 'Low Stock' : 'In Stock'; }

    window.restock = function(id) {
      const list = Store.inventory();
      const item = list.find(i => i.id === id);
      if (item) { item.stock += 10; refreshStatus(item); }
      Store.saveInventory(list);
      render();
    };
    window.removeItem = function(id) {
      if (!confirm('Remove this inventory item?')) return;
      Store.saveInventory(Store.inventory().filter(i => i.id !== id));
      render();
    };

    document.getElementById('search').addEventListener('input', (e) => { query = e.target.value; render(); });
    document.querySelectorAll('.filter-chip').forEach(chip => {
      chip.addEventListener('click', () => {
        document.querySelectorAll('.filter-chip').forEach(c => c.classList.remove('active'));
        chip.classList.add('active');
        filter = chip.dataset.f;
        render();
      });
    });
    document.getElementById('add-btn').addEventListener('click', () => {
      inventoryModal.classList.add('open');
      document.getElementById('inventory-item').focus();
    });
    document.getElementById('close-inventory-modal').addEventListener('click', closeInventoryModal);
    document.getElementById('cancel-inventory').addEventListener('click', closeInventoryModal);
    inventoryModal.addEventListener('click', event => { if (event.target === inventoryModal) closeInventoryModal(); });
    inventoryForm.addEventListener('submit', event => {
      event.preventDefault();
      const item = document.getElementById('inventory-item').value.trim();
      const category = document.getElementById('inventory-category').value;
      const stock = parseInt(document.getElementById('inventory-stock').value, 10);
      const reorderLevel = parseInt(document.getElementById('inventory-reorder').value, 10);
      if (!item || Number.isNaN(stock) || Number.isNaN(reorderLevel)) return;
      const list = Store.inventory();
      const newItem = { id: uid('inv'), item, category, sku: 'IPV-' + Math.floor(1000 + Math.random() * 8999), stock, reorderLevel, status: 'In Stock' };
      refreshStatus(newItem);
      list.push(newItem);
      Store.saveInventory(list);
      render();
      closeInventoryModal();
    });

    render();
  }
</script>
</body>
</html>
