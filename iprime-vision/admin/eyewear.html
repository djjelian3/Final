<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Eyewear Catalog — iPrime Vision Admin</title>
<link rel="stylesheet" href="../css/admin.css">
<style>
  .ew-card { background:var(--white); border:1px solid var(--border-soft); border-radius:var(--radius-lg); overflow:hidden; box-shadow:var(--shadow-sm); }
  .ew-visual { height:170px; display:flex; align-items:center; justify-content:center; background:var(--dirty-white-dim); overflow:hidden; }
  .ew-visual img { width:100%; height:100%; object-fit:contain; }
  .ew-fallback { font-size:3rem; }
  .ew-body { padding:16px; }
  .ew-remove { width:auto; padding:7px 12px; font-size:.78rem; }
  .ew-remove svg { width:16px; height:16px; }
</style>
</head>
<body>

<div id="admin-mount"></div>

<script>window.__ipvDepth = 1;</script>
<script src="../js/data.js"></script>
<script src="../js/auth.js"></script>
<script src="../js/components.js"></script>
<script>
  const admin = renderAdminShellStart('eyewear');
  if (admin) {
    renderAdminTopbar('Eyewear Catalog', 'Frames, sunglasses, and lenses available in-store.');

    document.getElementById('admin-content').innerHTML = `
      <div class="toolbar">
        <div class="search-box">${svg('search')}<input type="text" id="search" placeholder="Search products…"></div>
        <button class="btn btn-primary btn-sm" id="add-btn" style="margin-left:auto;">${svg('plus')} Add Product</button>
      </div>
      <div class="grid-4" id="grid"></div>
    `;
    document.getElementById('admin-content').insertAdjacentHTML('beforeend', `
      <div class="modal-overlay" id="eyewear-modal" role="dialog" aria-modal="true" aria-labelledby="eyewear-modal-title">
        <div class="modal-box">
          <div class="modal-head"><div><span class="eyebrow">Catalog management</span><h2 id="eyewear-modal-title">Add Product</h2></div><button class="modal-close" type="button" id="close-eyewear-modal" aria-label="Close">${svg('x')}</button></div>
          <form id="eyewear-form">
            <div class="field"><label for="eyewear-name">Product name</label><input id="eyewear-name" required placeholder="e.g. Aria Round Frame"></div>
            <div class="field-row"><div class="field"><label for="eyewear-category">Category</label><select id="eyewear-category"><option>Eyeglasses</option><option>Sunglasses</option><option>Contact Lenses</option></select></div><div class="field"><label for="eyewear-material">Material</label><input id="eyewear-material" value="Acetate" required></div></div>
            <div class="field-row"><div class="field"><label for="eyewear-price">Price (₱)</label><input id="eyewear-price" type="number" min="0" step="1" value="2999" required></div><div class="field"><label for="eyewear-stock">Stock quantity</label><input id="eyewear-stock" type="number" min="0" step="1" value="10" required></div></div>
            <div class="field"><label for="eyewear-image">Image filename <span class="text-soft">(optional)</span></label><input id="eyewear-image" placeholder="e.g. aria-round-frame.jpg"></div>
            <div class="modal-actions"><button class="btn btn-ghost" type="button" id="cancel-eyewear">Cancel</button><button class="btn btn-primary" type="submit">${svg('check')} Add Product</button></div>
          </form>
        </div>
      </div>
    `);
    const eyewearModal = document.getElementById('eyewear-modal');
    const eyewearForm = document.getElementById('eyewear-form');
    function closeEyewearModal() { eyewearModal.classList.remove('open'); eyewearForm.reset(); document.getElementById('eyewear-material').value = 'Acetate'; document.getElementById('eyewear-price').value = '2999'; document.getElementById('eyewear-stock').value = '10'; }

    let query = '';
    const defaultImages = {
      'Aria Round Frame': 'aria-round-frame.jpg',
      'Solstice Aviator': 'solstice-aviator.jpg',
      'Nomad Rectangle': 'nomad-rectangle.jpg',
      'Daily Comfort Lens (30pk)': 'daily-comfort-lens.jpg',
      'Blue-Light Guard': 'blue-light-guard.jpg',
      'Coastal Cat-Eye': 'coastal-cat-eye.jpg'
    };

    function imageMarkup(product) {
      const image = product.image || defaultImages[product.name];
      const fallback = product.img || (product.category === 'Sunglasses' ? '🕶️' : product.category === 'Contact Lenses' ? '👁️' : '👓');
      if (!image) return `<span class="ew-fallback" role="img" aria-label="${product.category}">${fallback}</span>`;
      return `<img src="../images/${encodeURIComponent(image)}" alt="${product.name}" onerror="this.replaceWith(Object.assign(document.createElement('span'), { className: 'ew-fallback', role: 'img', ariaLabel: '${product.category}', textContent: '${fallback}' }))">`;
    }

    function render() {
      let list = Store.eyewear().slice();
      if (query) list = list.filter(e => e.name.toLowerCase().includes(query.toLowerCase()));
      const grid = document.getElementById('grid');
      if (!list.length) { grid.innerHTML = `<div class="empty-state" style="grid-column:1/-1;">${svg('layers')}<p>No products found.</p></div>`; return; }
      grid.innerHTML = list.map(e => `
        <div class="ew-card">
          <div class="ew-visual">${imageMarkup(e)}</div>
          <div class="ew-body">
            <span class="tag tag-nude mb-8">${e.category}</span>
            <h3 style="font-size:1rem;margin:6px 0 4px;">${e.name}</h3>
            <p class="text-soft" style="font-size:.8rem;margin-bottom:10px;">${e.material}</p>
            <div class="flex-between">
              <strong style="font-family:var(--font-display);">₱${e.price.toLocaleString()}</strong>
              <span class="tag ${e.stock <= 8 ? 'tag-warning' : 'tag-success'}">${e.stock} in stock</span>
            </div>
            <button class="btn btn-outline btn-sm ew-remove mt-16" onclick="removeItem('${e.id}')">${svg('trash')} Remove</button>
          </div>
        </div>`).join('');
    }

    window.removeItem = function(id) {
      if (!confirm('Remove this product from the catalog?')) return;
      Store.saveEyewear(Store.eyewear().filter(e => e.id !== id));
      render();
    };

    document.getElementById('search').addEventListener('input', (e) => { query = e.target.value; render(); });
    document.getElementById('add-btn').addEventListener('click', () => { eyewearModal.classList.add('open'); document.getElementById('eyewear-name').focus(); });
    document.getElementById('close-eyewear-modal').addEventListener('click', closeEyewearModal);
    document.getElementById('cancel-eyewear').addEventListener('click', closeEyewearModal);
    eyewearModal.addEventListener('click', event => { if (event.target === eyewearModal) closeEyewearModal(); });
    eyewearForm.addEventListener('submit', event => {
      event.preventDefault();
      const name = document.getElementById('eyewear-name').value.trim();
      const category = document.getElementById('eyewear-category').value;
      const material = document.getElementById('eyewear-material').value.trim();
      const price = parseInt(document.getElementById('eyewear-price').value, 10);
      const stock = parseInt(document.getElementById('eyewear-stock').value, 10);
      const image = document.getElementById('eyewear-image').value.trim();
      if (!name || !material || Number.isNaN(price) || Number.isNaN(stock) || price < 0 || stock < 0) return;
      const list = Store.eyewear();
      list.push({ id: uid('ew'), name, category, material, price, stock, image, img: category === 'Sunglasses' ? '🕶️' : category === 'Contact Lenses' ? '👁️' : '👓' });
      Store.saveEyewear(list);
      render();
      closeEyewearModal();
    });

    render();
  }
</script>
</body>
</html>
