<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Prescriptions — iPrime Vision Admin</title>
<link rel="stylesheet" href="../css/admin.css">
</head>
<body>

<div id="admin-mount"></div>

<script>window.__ipvDepth = 1;</script>
<script src="../js/data.js"></script>
<script src="../js/auth.js"></script>
<script src="../js/components.js"></script>
<script>
  const admin = renderAdminShellStart('prescriptions');
  if (admin) {
    renderAdminTopbar('Prescriptions', "Every patient's lens prescription on record.");

    document.getElementById('admin-content').innerHTML = `
      <div class="panel">
        <div class="panel-body pad">
          <div class="toolbar">
            <div class="search-box">${svg('search')}<input type="text" id="search" placeholder="Search by patient name…"></div>
            <button class="btn btn-primary btn-sm" id="add-btn" style="margin-left:auto;">${svg('plus')} New Prescription</button>
          </div>
          <div class="table-wrap">
            <table class="data-table">
              <thead><tr><th>Patient</th><th>Date</th><th>OD (SPH/CYL)</th><th>OS (SPH/CYL)</th><th>PD</th><th>Status</th><th></th></tr></thead>
              <tbody id="rows"></tbody>
            </table>
          </div>
        </div>
      </div>
      <div class="modal-overlay" id="prescription-modal" role="dialog" aria-modal="true" aria-labelledby="prescription-modal-title">
        <div class="modal-box">
          <div class="modal-head">
            <div>
              <span class="eyebrow">Patient record</span>
              <h2 id="prescription-modal-title">New Prescription</h2>
            </div>
            <button class="modal-close" type="button" id="close-prescription-modal" aria-label="Close">${svg('x')}</button>
          </div>
          <form id="prescription-form">
            <div class="field">
              <label for="rx-patient">Patient name</label>
              <input id="rx-patient" required placeholder="e.g. Juan Dela Cruz">
            </div>
            <div class="rx-field-grid">
              <div class="field">
                <label for="rx-od-sph">OD sphere</label>
                <input id="rx-od-sph" value="0.00" required>
              </div>
              <div class="field">
                <label for="rx-od-cyl">OD cylinder</label>
                <input id="rx-od-cyl" value="0.00" required>
              </div>
              <div class="field">
                <label for="rx-os-sph">OS sphere</label>
                <input id="rx-os-sph" value="0.00" required>
              </div>
              <div class="field">
                <label for="rx-os-cyl">OS cylinder</label>
                <input id="rx-os-cyl" value="0.00" required>
              </div>
            </div>
            <div class="field">
              <label for="rx-pd">Pupillary distance (mm)</label>
              <input id="rx-pd" value="62" required>
            </div>
            <div class="modal-actions">
              <button class="btn btn-ghost" type="button" id="cancel-prescription">Cancel</button>
              <button class="btn btn-primary" type="submit">${svg('check')} Save Prescription</button>
            </div>
          </form>
        </div>
      </div>
    `;

    const prescriptionModal = document.getElementById('prescription-modal');
    const prescriptionForm = document.getElementById('prescription-form');
    function closePrescriptionModal() {
      prescriptionModal.classList.remove('open');
      prescriptionForm.reset();
      document.getElementById('rx-od-sph').value = '0.00';
      document.getElementById('rx-od-cyl').value = '0.00';
      document.getElementById('rx-os-sph').value = '0.00';
      document.getElementById('rx-os-cyl').value = '0.00';
      document.getElementById('rx-pd').value = '62';
    }

    let query = '';
    function render() {
      let list = Store.prescriptions().slice().sort((a,b) => b.date.localeCompare(a.date));
      if (query) list = list.filter(r => r.patient.toLowerCase().includes(query.toLowerCase()));
      const rows = document.getElementById('rows');
      if (!list.length) { rows.innerHTML = `<tr><td colspan="7"><div class="empty-state">${svg('glasses')}<p>No prescriptions found.</p></div></td></tr>`; return; }
      rows.innerHTML = list.map(r => `
        <tr>
          <td><strong>${r.patient}</strong></td>
          <td>${fmtDate(r.date)}</td>
          <td>${r.odSph} / ${r.odCyl}</td>
          <td>${r.osSph} / ${r.osCyl}</td>
          <td>${r.pd}mm</td>
          <td><span class="tag ${r.status === 'Active' ? 'tag-success' : 'tag-info'}">${r.status}</span></td>
          <td><button class="action-icon" title="Delete" onclick="removeRx('${r.id}')">${svg('trash')}</button></td>
        </tr>`).join('');
    }

    window.removeRx = function(id) {
      if (!confirm('Delete this prescription?')) return;
      Store.savePrescriptions(Store.prescriptions().filter(r => r.id !== id));
      render();
    };

    document.getElementById('search').addEventListener('input', (e) => { query = e.target.value; render(); });
    document.getElementById('add-btn').addEventListener('click', () => {
      prescriptionModal.classList.add('open');
      document.getElementById('rx-patient').focus();
    });
    document.getElementById('close-prescription-modal').addEventListener('click', closePrescriptionModal);
    document.getElementById('cancel-prescription').addEventListener('click', closePrescriptionModal);
    prescriptionModal.addEventListener('click', (event) => {
      if (event.target === prescriptionModal) closePrescriptionModal();
    });
    prescriptionForm.addEventListener('submit', (event) => {
      event.preventDefault();
      const patient = document.getElementById('rx-patient').value.trim();
      const odSph = document.getElementById('rx-od-sph').value.trim();
      const odCyl = document.getElementById('rx-od-cyl').value.trim();
      const osSph = document.getElementById('rx-os-sph').value.trim();
      const osCyl = document.getElementById('rx-os-cyl').value.trim();
      const pd = document.getElementById('rx-pd').value.trim();
      const list = Store.prescriptions();
      list.push({ id: uid('rx'), patientId: uid('pt'), patient, date: todayISO(), odSph, odCyl, osSph, osCyl, pd, notes: '', status: 'Active' });
      Store.savePrescriptions(list);

      const notifs = Store.notifications();
      notifs.push({ id: uid('nt'), audience: 'admin', title: `Prescription for ${patient} has been added`, time: new Date().toISOString(), read: true, type: 'prescription' });
      Store.saveNotifications(notifs);

      render();
      closePrescriptionModal();
    });

    render();
  }
</script>
</body>
</html>
