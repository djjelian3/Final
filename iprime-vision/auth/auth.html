<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign In — iPrime Vision</title>
<link rel="stylesheet" href="../css/style.css">
<style>
  .auth-wrap { min-height: 100vh; display: grid; grid-template-columns: 1fr 1fr; }
  .auth-visual {
    background: linear-gradient(160deg, var(--brown), var(--brown-deep));
    color: var(--dirty-white); padding: 56px; display: flex; flex-direction: column; justify-content: space-between;
    position: relative; overflow: hidden;
  }
  .auth-visual::after {
    content: ''; position: absolute; width: 420px; height: 420px; border-radius: 50%;
    border: 60px solid rgba(231,205,178,.08); right: -140px; bottom: -140px;
  }
  .auth-form-side { display: flex; align-items: center; justify-content: center; padding: 40px 24px; }
  .auth-card { width: 100%; max-width: 420px; }
  .tab-row { display: flex; background: var(--dirty-white-dim); border-radius: var(--radius-pill); padding: 4px; margin-bottom: 30px; }
  .tab-btn { flex: 1; padding: 10px; border: none; background: transparent; border-radius: var(--radius-pill); font-weight: 700; color: var(--brown-soft); }
  .tab-btn.active { background: var(--brown); color: var(--white); }
  .auth-panel { display: none; }
  .auth-panel.active { display: block; }
  .demo-note { background: var(--nude-light); border-radius: var(--radius-sm); padding: 12px 14px; font-size: .78rem; color: var(--brown-soft); margin-bottom: 20px; }
  @media (max-width: 900px) { .auth-wrap { grid-template-columns: 1fr; } .auth-visual { min-height: 260px; } }
</style>
</head>
<body>

<div class="auth-wrap">
  <div class="auth-visual">
    <a href="../index.html" class="brand" style="color:var(--white);">
      <span class="brand-logo">iPRIME-Vision</span>
    </a>
    <div>
      <h2 style="color:var(--white);font-size:2.1rem;max-width:420px;">Your vision, your record, always in view.</h2>
      <p style="color:var(--nude-light);max-width:380px;">Sign in to manage appointments, view prescriptions, and stay on top of your eye care — all in one place.</p>
    </div>
    <p style="color:var(--nude-light);opacity:.7;font-size:.8rem;">© 2026 iPrime Vision & Eyecare Specialists</p>
  </div>

  <div class="auth-form-side">
    <div class="auth-card">
      <div class="tab-row">
        <button class="tab-btn active" id="tab-login" data-tab="login">Sign In</button>
        <button class="tab-btn" id="tab-signup" data-tab="signup">Create Account</button>
      </div>

  

      <div class="form-message" id="form-msg"></div>

      <!-- LOGIN -->
      <form id="login-panel" class="auth-panel active">
        <div class="field">
          <label for="login-email">Email Address</label>
          <input type="email" id="login-email" required placeholder="you@example.com">
        </div>
        <div class="field">
          <label for="login-password">Password</label>
          <input type="password" id="login-password" required placeholder="••••••••">
        </div>
        <button type="submit" class="btn btn-primary btn-block">Sign In</button>
      </form>

      <!-- SIGNUP -->
      <form id="signup-panel" class="auth-panel">
        <div class="field">
          <label for="signup-name">Full Name</label>
          <input type="text" id="signup-name" required placeholder="Juan Dela Cruz">
        </div>
        <div class="field">
          <label for="signup-email">Email Address</label>
          <input type="email" id="signup-email" required placeholder="you@example.com">
        </div>
        <div class="field">
          <label for="signup-phone">Phone Number</label>
          <input type="tel" id="signup-phone" required placeholder="+63 9XX XXX XXXX">
        </div>
        <div class="field">
          <label for="signup-password">Password</label>
          <input type="password" id="signup-password" required minlength="6" placeholder="At least 6 characters">
        </div>
        <div class="checkbox-row mb-16">
          <input type="checkbox" id="signup-terms" required>
          <label for="signup-terms">I agree to the terms of service and privacy policy.</label>
        </div>
        <button type="submit" class="btn btn-primary btn-block">Create Patient Account</button>
      </form>

      <p class="text-center mt-24 text-soft" style="font-size:.85rem;"><a href="../index.html" style="color:var(--latte-dark);font-weight:700;">← Back to homepage</a></p>
    </div>
  </div>
</div>

<script>window.__ipvDepth = 1;</script>
<script src="../js/data.js"></script>
<script src="../js/auth.js"></script>
<script>
  // Tabs
  document.querySelectorAll('.tab-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      document.querySelectorAll('.auth-panel').forEach(p => p.classList.remove('active'));
      btn.classList.add('active');
      document.getElementById(btn.dataset.tab + '-panel').classList.add('active');
      hideMsg();
    });
  });

  const msgBox = document.getElementById('form-msg');
  function showMsg(text, type) {
    msgBox.textContent = text;
    msgBox.className = 'form-message show ' + type;
  }
  function hideMsg() { msgBox.className = 'form-message'; }

  function redirectForRole(role) {
    const next = new URLSearchParams(window.location.search).get('next');
    window.location.href = next || (role === 'admin' ? '../admin/dashboard.html' : '../patient/dashboard.html');
  }

  document.getElementById('login-panel').addEventListener('submit', async (e) => {
    e.preventDefault();
    const email = document.getElementById('login-email').value.trim();
    const password = document.getElementById('login-password').value;
    const res = await loginUser(email, password);
    if (!res.ok) { showMsg(res.message, 'error'); return; }
    showMsg('Welcome back, ' + res.user.name.split(' ')[0] + '! Redirecting…', 'success');
    setTimeout(() => {
      redirectForRole(res.user.role);
    }, 700);
  });

  document.getElementById('signup-panel').addEventListener('submit', async (e) => {
    e.preventDefault();
    const name = document.getElementById('signup-name').value.trim();
    const email = document.getElementById('signup-email').value.trim();
    const phone = document.getElementById('signup-phone').value.trim();
    const password = document.getElementById('signup-password').value;
    const res = await signupPatient({ name, email, password, phone });
    if (!res.ok) { showMsg(res.message, 'error'); return; }
    showMsg('Account created! Redirecting to your dashboard…', 'success');
    setTimeout(() => { redirectForRole(res.user.role); }, 700);
  });

  // Keep the sign-in form available so users can switch accounts.
</script>
</body>
</html>
